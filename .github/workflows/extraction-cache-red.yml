name: Extraction Cache Red Check

on:
  pull_request:
    branches:
      - planning/channels-providers-extraction-latest
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  red-check:
    if: github.event.pull_request.head.ref == 'worktree/channels-providers-extraction-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Prove generated-cache test is red
        run: >-
          uv run pytest
          tests/extraction/test_filesystem_inventory.py::test_inventory_ignores_generated_python_cache_files
          -q

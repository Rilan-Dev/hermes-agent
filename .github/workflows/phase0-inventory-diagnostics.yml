name: Phase 0 Inventory Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/platform_inventory/**"
      - "tests/scripts/platform_inventory/**"
      - "tests/fixtures/platform_inventory/**"
      - ".github/workflows/phase0-inventory-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    name: Inventory integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHASE0_DIAGNOSTICS_DIR: /tmp/phase0-inventory-diagnostics
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install repository dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Record source state
        run: |
          mkdir -p "$PHASE0_DIAGNOSTICS_DIR"
          git status --porcelain=v1 --untracked-files=all | tee "$PHASE0_DIAGNOSTICS_DIR/git-status.txt"
          git rev-parse HEAD | tee "$PHASE0_DIAGNOSTICS_DIR/checked-head.txt"
          git branch --show-current | tee "$PHASE0_DIAGNOSTICS_DIR/checked-branch.txt"

      - name: Run Phase 0 tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest tests/scripts/platform_inventory -vv -s 2>&1 | tee "$PHASE0_DIAGNOSTICS_DIR/pytest.log"

      - name: Run inventory generator
        id: generator
        continue-on-error: true
        run: |
          set -o pipefail
          uv run python -m scripts.platform_inventory \
            --root . \
            --output "$PHASE0_DIAGNOSTICS_DIR/generated" \
            generate 2>&1 | tee "$PHASE0_DIAGNOSTICS_DIR/generator.log"

      - name: Write diagnostic summary
        if: always()
        run: |
          {
            echo "tests_outcome=${{ steps.tests.outcome }}"
            echo "generator_outcome=${{ steps.generator.outcome }}"
            if [ -f "$PHASE0_DIAGNOSTICS_DIR/generated/phase-0-review.md" ]; then
              echo ""
              cat "$PHASE0_DIAGNOSTICS_DIR/generated/phase-0-review.md"
            fi
          } | tee "$PHASE0_DIAGNOSTICS_DIR/summary.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-inventory-diagnostics
          path: /tmp/phase0-inventory-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce result
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.generator.outcome }}" = "success"

      - name: Persist validated reports once
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.tests.outcome == 'success' &&
          steps.generator.outcome == 'success'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          persist_root=/tmp/phase0-persist
          rm -rf "$persist_root"
          git fetch origin "$HEAD_BRANCH"
          git worktree add --detach "$persist_root" "origin/$HEAD_BRANCH"

          if [ -f "$persist_root/generated/platform_inventory/phase-0-review.md" ]; then
            echo "Validated inventory is already committed; skipping persistence."
            exit 0
          fi

          mkdir -p "$persist_root/generated/platform_inventory"
          cp -R "$PHASE0_DIAGNOSTICS_DIR/generated/." \
            "$persist_root/generated/platform_inventory/"
          mkdir -p "$persist_root/docs/platform"
          cp "$PHASE0_DIAGNOSTICS_DIR/generated/phase-0-review.md" \
            "$persist_root/docs/platform/phase-0-findings.md"

          cd "$persist_root"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/platform_inventory docs/platform/phase-0-findings.md
          git commit -m "docs(platform): archive validated Phase 0 inventory"
          git push origin "HEAD:$HEAD_BRANCH"

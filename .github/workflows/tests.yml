name: Tests

on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel test slices
        type: number
        default: 8

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: "Generate slices"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations
          # Saves use test-durations-${run_id}, so the exact key above never
          # matches — without this prefix fallback the cache ALWAYS missed,
          # LPT slicing ran on no data, and unbalanced slices pushed heavy
          # files toward the per-file timeout under load.
          restore-keys: |
            test-durations-

      - name: Generate test slices
        id: matrix
        run: |
          MATRIX=$(python3 scripts/run_tests_parallel.py --generate-slices ${{ inputs.slice_count }})
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests slice ${{ matrix.slice.index }}/${{ inputs.slice_count }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Run tests (slice ${{ matrix.slice.index }}/${{ inputs.slice_count }})
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # File list is pre-computed by the generate job (--generate-slices)
        # which runs LPT distribution once and passes the file list to each
        # matrix job via --files. Previously each job re-discovered files and
        # re-ran LPT independently — redundant N times.
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --files '${{ matrix.slice.files }}'
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Upload per-slice durations
        # Advisory artifact (feeds slice balancing) — a transient artifact-
        # service blip must not fail an otherwise-green test slice.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-slice-${{ matrix.slice.index }}
          path: test_durations.json
          retention-days: 1

  # Merge per-slice duration data into a single cache, so future runs
  # (including PRs) get balanced slicing.
  save-durations:
    needs: test
    if: needs.test.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all slice durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-durations-slice-*
          path: durations
          merge-multiple: true

      - name: Merge into single durations file
        run: |
          python3 -c "
          import json, glob, os
          merged = {}
          for f in glob.glob('durations/*test_durations.json'):
            with open(f) as fh:
              merged.update(json.load(fh))
          with open('test_durations.json', 'w') as fh:
            json.dump(merged, fh, indent=2, sort_keys=True)
          print(f'Merged {len(merged)} file durations')
          "

      - name: Save merged duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-${{ github.run_id }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Packaged-wheel i18n smoke test
        run: |
          source .venv/bin/activate
          python -m pytest -m integration tests/test_wheel_locales_e2e.py -v

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  extraction-evidence:
    name: Generate extraction evidence artifact
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'worktree/channels-providers-extraction-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Refresh source references in evidence workspace
        env:
          OLD_SOURCE_SHA: d7b36070ef807841699ad32c5b6af547fee3ff64
          NEW_SOURCE_SHA: e3ce380c068f532fcceb2c087310fcc98da4ee38
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          old_sha = os.environ["OLD_SOURCE_SHA"]
          new_sha = os.environ["NEW_SOURCE_SHA"]
          matches = subprocess.run(
              ["git", "grep", "-Il", "-e", old_sha, "-e", "channels-providers-extraction", "--", "."],
              check=False,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          for raw in sorted(set(matches)):
              path = Path(raw)
              if path.as_posix().startswith(".github/workflows/"):
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old_sha, new_sha)
              updated = re.sub(
                  r"worktree/channels-providers-extraction(?!-latest)",
                  "worktree/channels-providers-extraction-latest",
                  updated,
              )
              updated = re.sub(
                  r"planning/channels-providers-extraction(?!-latest)",
                  "planning/channels-providers-extraction-latest",
                  updated,
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")
          PY
          rm -f tests/extraction/test_registry_snapshot_capture.py
          rm -f docs/extraction/EVIDENCE_RUN_REQUEST.md

      - name: Capture isolated registries and generate reports
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-extraction-home
          HERMES_ENABLE_PROJECT_PLUGINS: "0"
          HERMES_SAFE_MODE: "0"
          HERMES_PLUGINS_DEBUG: "0"
          PYTHONHASHSEED: "0"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          mkdir -p tests/extraction/snapshots
          uv run python -m scripts.extraction.registry_probe \
            > tests/extraction/snapshots/registry-snapshot.json
          uv run python -m json.tool \
            tests/extraction/snapshots/registry-snapshot.json >/dev/null
          uv run python -m scripts.extraction.build_inventory \
            --manifest extracted/hermes-connect-kit/extraction-manifest.yaml \
            --registry-snapshot tests/extraction/snapshots/registry-snapshot.json \
            --yaml docs/extraction/generated/phase-1-inventory.yaml \
            --markdown docs/extraction/generated/phase-1-inventory.md \
            --test-matrix docs/extraction/generated/phase-1-test-matrix.md
          git add docs/extraction/generated tests/extraction/snapshots
          uv run python -m scripts.extraction.build_inventory \
            --manifest extracted/hermes-connect-kit/extraction-manifest.yaml \
            --registry-snapshot tests/extraction/snapshots/registry-snapshot.json \
            --yaml docs/extraction/generated/phase-1-inventory.yaml \
            --markdown docs/extraction/generated/phase-1-inventory.md \
            --test-matrix docs/extraction/generated/phase-1-test-matrix.md
          git diff --exit-code -- docs/extraction/generated tests/extraction/snapshots

      - name: Verify extraction and selected existing behavior
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          uv run ruff check scripts/extraction tests/extraction
          uv run pytest tests/extraction -q
          uv run pytest \
            tests/providers \
            tests/gateway \
            tests/plugins/model_providers \
            tests/agent/transports \
            tests/hermes_cli/test_provider_parity.py \
            -q

      - name: Prove production source unchanged after refreshed baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            e3ce380c068f532fcceb2c087310fcc98da4ee38 HEAD
          UNEXPECTED="$(git diff --name-only \
            e3ce380c068f532fcceb2c087310fcc98da4ee38..HEAD \
            | grep -Ev '^(\.github/workflows/|docs/extraction/|docs/superpowers/plans/|extracted/hermes-connect-kit/extraction-manifest\.yaml$|scripts/extraction/|tests/extraction/)' || true)"
          test -z "$UNEXPECTED" || {
            printf 'Unexpected production changes:\n%s\n' "$UNEXPECTED"
            exit 1
          }

      - name: Package verified evidence
        run: |
          set -euo pipefail
          printf 'source_sha=e3ce380c068f532fcceb2c087310fcc98da4ee38\nhead_sha=%s\n' \
            "$(git rev-parse HEAD)" > docs/extraction/generated/verification-summary.txt
          tar -czf extraction-phase-1-evidence.tar.gz \
            docs/extraction \
            docs/superpowers/plans/2026-07-21-channels-providers-phase-1-inventory.md \
            extracted/hermes-connect-kit/extraction-manifest.yaml \
            tests/extraction

      - name: Upload verified extraction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extraction-phase-1-evidence
          path: extraction-phase-1-evidence.tar.gz
          retention-days: 14

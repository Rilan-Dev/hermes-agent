name: Extraction Evidence

on:
  pull_request:
    branches:
      - planning/channels-providers-extraction-latest
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: extraction-evidence-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.head.ref == 'worktree/channels-providers-extraction-latest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout refreshed work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Refresh approved source baseline references
        env:
          OLD_SOURCE_SHA: d7b36070ef807841699ad32c5b6af547fee3ff64
          NEW_SOURCE_SHA: e3ce380c068f532fcceb2c087310fcc98da4ee38
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          old_sha = os.environ["OLD_SOURCE_SHA"]
          new_sha = os.environ["NEW_SOURCE_SHA"]
          matches = subprocess.run(
              ["git", "grep", "-Il", "-e", old_sha, "-e", "channels-providers-extraction", "--", "."],
              check=False,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          for raw in sorted(set(matches)):
              path = Path(raw)
              if path.as_posix() == ".github/workflows/extraction-evidence.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old_sha, new_sha)
              updated = re.sub(
                  r"worktree/channels-providers-extraction(?!-latest)",
                  "worktree/channels-providers-extraction-latest",
                  updated,
              )
              updated = re.sub(
                  r"planning/channels-providers-extraction(?!-latest)",
                  "planning/channels-providers-extraction-latest",
                  updated,
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")
          PY
          rm -f tests/extraction/test_registry_snapshot_capture.py
          rm -f docs/extraction/EVIDENCE_RUN_REQUEST.md
          rm -f docs/extraction/EVIDENCE_TRIGGER_2.md

      - name: Capture isolated runtime registries
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-extraction-home
          HERMES_ENABLE_PROJECT_PLUGINS: "0"
          HERMES_SAFE_MODE: "0"
          HERMES_PLUGINS_DEBUG: "0"
          PYTHONHASHSEED: "0"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          mkdir -p tests/extraction/snapshots
          uv run python -m scripts.extraction.registry_probe \
            > tests/extraction/snapshots/registry-snapshot.json
          uv run python -m json.tool \
            tests/extraction/snapshots/registry-snapshot.json >/dev/null

      - name: Generate deterministic Phase 1 inventory
        run: |
          set -euo pipefail
          uv run python -m scripts.extraction.build_inventory \
            --manifest extracted/hermes-connect-kit/extraction-manifest.yaml \
            --registry-snapshot tests/extraction/snapshots/registry-snapshot.json \
            --yaml docs/extraction/generated/phase-1-inventory.yaml \
            --markdown docs/extraction/generated/phase-1-inventory.md \
            --test-matrix docs/extraction/generated/phase-1-test-matrix.md
          git add docs/extraction/generated tests/extraction/snapshots
          uv run python -m scripts.extraction.build_inventory \
            --manifest extracted/hermes-connect-kit/extraction-manifest.yaml \
            --registry-snapshot tests/extraction/snapshots/registry-snapshot.json \
            --yaml docs/extraction/generated/phase-1-inventory.yaml \
            --markdown docs/extraction/generated/phase-1-inventory.md \
            --test-matrix docs/extraction/generated/phase-1-test-matrix.md
          git diff --exit-code -- docs/extraction/generated tests/extraction/snapshots

      - name: Run extraction diagnostics
        id: diagnostics
        continue-on-error: true
        run: |
          set +e
          mkdir -p extraction-diagnostics
          set -o pipefail
          uv run ruff check scripts/extraction tests/extraction \
            2>&1 | tee extraction-diagnostics/ruff.log
          RUFF_STATUS=${PIPESTATUS[0]}
          uv run pytest tests/extraction -q \
            2>&1 | tee extraction-diagnostics/pytest.log
          PYTEST_STATUS=${PIPESTATUS[0]}
          printf 'ruff_status=%s\npytest_status=%s\n' \
            "$RUFF_STATUS" "$PYTEST_STATUS" \
            | tee extraction-diagnostics/status.txt
          echo "ruff_status=$RUFF_STATUS" >> "$GITHUB_OUTPUT"
          echo "pytest_status=$PYTEST_STATUS" >> "$GITHUB_OUTPUT"
          test "$RUFF_STATUS" -eq 0 && test "$PYTEST_STATUS" -eq 0

      - name: Upload extraction diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extraction-phase-1-diagnostics
          path: |
            extraction-diagnostics
            tests/extraction/snapshots/registry-snapshot.json
            docs/extraction/generated/phase-1-inventory.yaml
            docs/extraction/generated/phase-1-inventory.md
            docs/extraction/generated/phase-1-test-matrix.md
          retention-days: 14

      - name: Enforce extraction diagnostic result
        run: |
          test "${{ steps.diagnostics.outputs.ruff_status }}" = "0"
          test "${{ steps.diagnostics.outputs.pytest_status }}" = "0"

      - name: Run selected existing characterization baseline
        run: |
          set -euo pipefail
          scripts/run_tests.sh -j 4 \
            tests/providers \
            tests/gateway \
            tests/plugins/model_providers \
            tests/agent/transports \
            tests/hermes_cli/test_provider_parity.py \
            -q

      - name: Prove production source is unchanged after refresh
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            e3ce380c068f532fcceb2c087310fcc98da4ee38 HEAD
          UNEXPECTED="$(git diff --name-only \
            e3ce380c068f532fcceb2c087310fcc98da4ee38..HEAD \
            | grep -Ev '^(\.github/workflows/extraction-evidence\.yml$|\.github/workflows/tests\.yml$|docs/extraction/|docs/superpowers/plans/|extracted/hermes-connect-kit/extraction-manifest\.yaml$|scripts/extraction/|tests/extraction/)' || true)"
          test -z "$UNEXPECTED" || {
            printf 'Unexpected production changes:\n%s\n' "$UNEXPECTED"
            exit 1
          }

      - name: Package complete verified evidence
        run: |
          set -euo pipefail
          git diff --binary HEAD -- \
            docs/extraction \
            docs/superpowers/plans \
            extracted/hermes-connect-kit/extraction-manifest.yaml \
            tests/extraction \
            > extraction-phase-1.patch
          git diff --name-status HEAD -- \
            docs/extraction \
            docs/superpowers/plans \
            extracted/hermes-connect-kit/extraction-manifest.yaml \
            tests/extraction \
            > extraction-phase-1-name-status.txt
          tar -czf extraction-phase-1-complete.tar.gz \
            docs/extraction \
            docs/superpowers/plans/2026-07-21-channels-providers-phase-1-inventory.md \
            extracted/hermes-connect-kit/extraction-manifest.yaml \
            tests/extraction \
            extraction-phase-1.patch \
            extraction-phase-1-name-status.txt

      - name: Upload complete verified evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extraction-phase-1-complete
          path: extraction-phase-1-complete.tar.gz
          retention-days: 14

      - name: Apply verified evidence to staging through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: apply/phase1-evidence-latest
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r status path; do
            test -n "$path" || continue
            endpoint="repos/${GITHUB_REPOSITORY}/contents/${path}"
            current_sha="$(gh api "$endpoint?ref=$TARGET_BRANCH" --jq .sha 2>/dev/null || true)"
            if [[ "$status" == D* ]]; then
              test -n "$current_sha" || continue
              python3 - "$current_sha" "$TARGET_BRANCH" > payload.json <<'PY'
          import json, sys
          print(json.dumps({
              "message": "chore(extraction): remove temporary Phase 1 evidence file",
              "sha": sys.argv[1],
              "branch": sys.argv[2],
          }))
          PY
              gh api --method DELETE "$endpoint" --input payload.json >/dev/null
              continue
            fi
            python3 - "$path" "$current_sha" "$TARGET_BRANCH" > payload.json <<'PY'
          import base64, json, pathlib, sys
          path, current_sha, branch = sys.argv[1:]
          payload = {
              "message": "chore(extraction): apply verified Phase 1 evidence",
              "content": base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii"),
              "branch": branch,
          }
          if current_sha:
              payload["sha"] = current_sha
          print(json.dumps(payload))
          PY
            gh api --method PUT "$endpoint" --input payload.json >/dev/null
          done < extraction-phase-1-name-status.txt

test_rules:
  - path: tests/gateway
    kind: root
    behavior: Gateway, channel adapter, delivery, authorization, session, relay, and plugin behavior.
  - path: tests/providers
    kind: root
    behavior: Provider profile registration, aliases, and lazy discovery.
  - path: tests/plugins/model_providers
    kind: root
    behavior: Bundled model-provider plugin profile behavior.
  - path: tests/agent/transports
    kind: root
    behavior: Provider protocol transport requests, responses, tools, and usage normalization.
  - path: tests/hermes_cli/test_provider_*.py
    kind: glob
    behavior: Provider catalog, setup, metadata, grouping, and parity contracts.
  - path: tests/hermes_cli/test_*_provider.py
    kind: glob
    behavior: Provider runtime and integration behavior using provider-suffixed test modules.
  - path: tests/hermes_cli/test_api_key_providers.py
    kind: file
    behavior: API-key provider setup and credential behavior.
  - path: tests/hermes_cli/test_provider_parity.py
    kind: file
    behavior: Canonical provider parity across CLI and desktop provider surfaces.
  - path: tests/hermes_cli/test_provider_groups.py
    kind: file
    behavior: Provider presentation group behavior without redefining membership.
  - path: tests/hermes_cli/test_inventory.py
    kind: file
    behavior: Shared provider and model inventory payload.
  - path: tests/hermes_cli/test_models*.py
    kind: glob
    behavior: Canonical and discovered model catalog behavior.
  - path: tests/hermes_cli/test_model_*.py
    kind: glob
    behavior: Model selection and provider setup workflows.
  - path: tests/hermes_cli/test_auth*.py
    kind: glob
    behavior: Provider authentication stores, flows, refresh, and logout behavior.
  - path: tests/hermes_cli/test_runtime_provider*.py
    kind: glob
    behavior: Runtime provider endpoint, API mode, credential, and pool resolution.
  - path: tests/hermes_cli/test_azure_detect.py
    kind: file
    behavior: Azure endpoint and API-mode detection.
  - path: tests/agent/test_auxiliary_client.py
    kind: file
    behavior: Auxiliary client provider runtime integration.
  - path: tests/agent/test_*credential*.py
    kind: glob
    behavior: Credential pooling, rotation, attribution, and persistence behavior.
  - path: tests/agent/test_secret_scope*.py
    kind: glob
    behavior: Profile and workstream secret scoping.
  - path: tests/agent/test_*transport*.py
    kind: glob
    behavior: Runtime transport selection outside the transport test root.
  - path: apps/desktop/e2e/onboarding.spec.ts
    kind: file
    behavior: Desktop first-run onboarding workflow.
  - path: apps/desktop/src/store/onboarding.test.ts
    kind: file
    behavior: Desktop onboarding state transitions and persistence.
  - path: apps/desktop/src/components/onboarding/index.test.tsx
    kind: file
    behavior: Desktop onboarding component behavior.
  - path: apps/desktop/src/app/settings/providers-settings.test.tsx
    kind: file
    behavior: Desktop provider settings membership and interaction behavior.
  - path: apps/desktop/src/app/messaging/*.test.tsx
    kind: glob
    behavior: Desktop messaging platform configuration and presentation behavior.


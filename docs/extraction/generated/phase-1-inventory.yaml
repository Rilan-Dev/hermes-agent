plugins:
  platforms:
  - key: dingtalk
    name: dingtalk-platform
    kind: platform
    version: 1.0.0
    description: DingTalk gateway adapter for Hermes Agent. Connects to DingTalk via the dingtalk-stream SDK (Stream Mode)
      and relays messages between DingTalk chats and the Hermes agent. Supports text, images, audio, video, rich text, files,
      group @mention gating, free-response chats, and per-user allowlists.
    manifest_path: plugins/platforms/dingtalk/plugin.yaml
    module_path: plugins/platforms/dingtalk/__init__.py
  - key: discord
    name: discord-platform
    kind: platform
    version: 1.0.0
    description: Discord gateway adapter for Hermes Agent. Connects to Discord via the discord.py library and relays messages
      between Discord guilds/DMs and the Hermes agent. Supports voice mode, slash commands, free-response channels, role-based
      DM auth, threads, reactions, and channel skill bindings.
    manifest_path: plugins/platforms/discord/plugin.yaml
    module_path: plugins/platforms/discord/__init__.py
  - key: email
    name: email-platform
    kind: platform
    version: 1.0.0
    description: Email gateway adapter for Hermes Agent. Polls an IMAP mailbox for inbound messages and replies over SMTP,
      relaying email threads to and from the Hermes agent.
    manifest_path: plugins/platforms/email/plugin.yaml
    module_path: plugins/platforms/email/__init__.py
  - key: feishu
    name: feishu-platform
    kind: platform
    version: 1.0.0
    description: Feishu / Lark gateway adapter for Hermes Agent. Connects to Feishu (China) or Lark (International) via the
      official lark-oapi SDK over WebSocket or webhook and relays messages between Feishu/Lark chats and the Hermes agent.
      Supports text, images, video, voice, documents, threads, DM pairing, group @mention gating, drive comment events, and
      meeting invites.
    manifest_path: plugins/platforms/feishu/plugin.yaml
    module_path: plugins/platforms/feishu/__init__.py
  - key: google_chat
    name: google_chat-platform
    kind: platform
    version: 1.0.0
    description: Google Chat gateway adapter for Hermes Agent. Connects through authenticated HTTP callbacks or an optional
      Cloud Pub/Sub pull subscription for inbound events, and uses the Google Chat REST API for outbound messages. Native
      file attachments are delivered via per-user OAuth (each user runs /setup-files once in their own DM).
    manifest_path: plugins/platforms/google_chat/plugin.yaml
    module_path: plugins/platforms/google_chat/__init__.py
  - key: homeassistant
    name: homeassistant-platform
    kind: platform
    version: 1.0.0
    description: Home Assistant gateway adapter for Hermes Agent. Subscribes to HA's WebSocket event bus and forwards state-change
      events (with per-entity cooldowns and domain/entity filtering) to the agent. Outbound messages are delivered as HA persistent
      notifications via the REST API. Out-of-process cron delivery via the ``notify.notify`` service is also supported.
    manifest_path: plugins/platforms/homeassistant/plugin.yaml
    module_path: plugins/platforms/homeassistant/__init__.py
  - key: irc
    name: irc-platform
    kind: platform
    version: 1.0.0
    description: IRC gateway adapter for Hermes Agent. Connects to an IRC server and relays messages between an IRC channel
      (or DMs) and the Hermes agent.  No external dependencies — uses Python's stdlib asyncio for the IRC protocol.
    manifest_path: plugins/platforms/irc/plugin.yaml
    module_path: plugins/platforms/irc/__init__.py
  - key: line
    name: line-platform
    kind: platform
    version: 1.0.0
    description: LINE Messaging API gateway adapter for Hermes Agent. Runs an aiohttp webhook server that receives LINE webhook
      events (with HMAC-SHA256 signature verification) and relays messages between LINE chats (1:1, groups, rooms) and the
      Hermes agent. Outbound replies prefer the free reply token and fall back to the metered Push API when the token has
      expired or is absent. Slow LLM responses surface a Template Buttons postback bubble so the user can fetch the answer
      with a fresh reply token (free) once it's ready.
    manifest_path: plugins/platforms/line/plugin.yaml
    module_path: plugins/platforms/line/__init__.py
  - key: matrix
    name: matrix-platform
    kind: platform
    version: 1.0.0
    description: Matrix gateway adapter for Hermes Agent. Connects to a Matrix homeserver via mautrix (with optional E2EE)
      and relays messages between Matrix rooms/DMs and the Hermes agent. Supports threads, HTML/markdown rendering, native
      media uploads, mention gating, free-response rooms, and per-room allowlists.
    manifest_path: plugins/platforms/matrix/plugin.yaml
    module_path: plugins/platforms/matrix/__init__.py
  - key: mattermost
    name: mattermost-platform
    kind: platform
    version: 1.0.0
    description: Mattermost gateway adapter for Hermes Agent. Connects to a self-hosted or cloud Mattermost instance via the
      v4 REST API + WebSocket event stream and relays messages between Mattermost channels/DMs and the Hermes agent. Supports
      thread-mode replies, native file uploads, channel-scoped allowlists, and home-channel cron delivery.
    manifest_path: plugins/platforms/mattermost/plugin.yaml
    module_path: plugins/platforms/mattermost/__init__.py
  - key: ntfy
    name: ntfy-platform
    kind: platform
    version: 1.0.0
    description: 'ntfy push-notification gateway adapter for Hermes Agent. Subscribes to a topic on ntfy.sh or any self-hosted
      ntfy server via HTTP streaming, and publishes replies via HTTP POST. Lightweight — no external SDK, only httpx (already
      a Hermes dependency).

      ntfy has no native user-identity primitive; the adapter treats each topic as a single trusted channel and never derives
      user identity from publisher-controlled fields. Use a private topic + read token for any real trust boundary.'
    manifest_path: plugins/platforms/ntfy/plugin.yaml
    module_path: plugins/platforms/ntfy/__init__.py
  - key: photon
    name: photon-platform
    kind: platform
    version: 0.3.0
    description: 'Photon Spectrum gateway adapter for Hermes Agent. Connects to iMessage (and other Spectrum interfaces) through
      Photon''s managed Spectrum platform. Both directions run over the `spectrum-ts` SDK''s long-lived gRPC stream via a
      small supervised Node sidecar — inbound messages arrive on the SDK''s `app.messages` stream (no webhook, no public URL,
      no signing secret), and outbound messages are sent over the same sidecar.

      The plugin ships with a `hermes photon` CLI for the one-time device login + project + user setup. Runtime credentials
      are written to ``~/.hermes/.env`` (``PHOTON_PROJECT_ID`` = the Spectrum project id, ``PHOTON_PROJECT_SECRET``) like
      every other channel, with management metadata (device token, dashboard project id) in ``~/.hermes/auth.json``. Photon''s
      free shared-line model lets users get started without a paid plan.'
    manifest_path: plugins/platforms/photon/plugin.yaml
    module_path: plugins/platforms/photon/__init__.py
  - key: raft
    name: raft-platform
    kind: platform
    version: 1.0.0
    description: Raft gateway adapter for Hermes Agent. Connects to a Raft workspace as an external agent via a local wake-channel
      bridge. The adapter starts a loopback HTTP endpoint that receives content-free wake hints from the bridge, then injects
      them into the Hermes gateway session pipeline. The agent reads and sends messages through the Raft CLI — the adapter
      never touches message bodies or delivery cursors.
    manifest_path: plugins/platforms/raft/plugin.yaml
    module_path: plugins/platforms/raft/__init__.py
  - key: simplex
    name: simplex-platform
    kind: platform
    version: 1.1.0
    description: SimpleX Chat gateway adapter for Hermes Agent. Connects to a local simplex-chat daemon via WebSocket and
      relays messages between SimpleX contacts/groups and the Hermes agent. SimpleX is decentralised and assigns no persistent
      user IDs — every contact is an opaque internal ID generated at connection time, making it one of the most private messengers
      available.
    manifest_path: plugins/platforms/simplex/plugin.yaml
    module_path: plugins/platforms/simplex/__init__.py
  - key: slack
    name: slack-platform
    kind: platform
    version: 1.0.0
    description: Slack gateway adapter for Hermes Agent. Connects to Slack via slack-bolt in Socket Mode and relays messages
      between Slack channels/DMs and the Hermes agent. Supports slash commands, threads, mrkdwn rendering, approval blocks,
      free-response channels, mention gating, and channel skill bindings.
    manifest_path: plugins/platforms/slack/plugin.yaml
    module_path: plugins/platforms/slack/__init__.py
  - key: sms
    name: sms-platform
    kind: platform
    version: 1.0.0
    description: SMS gateway adapter for Hermes Agent via Twilio. Sends and receives SMS through the Twilio REST API + inbound
      webhook, relaying texts between phone numbers and the Hermes agent. Markdown is stripped to plain text.
    manifest_path: plugins/platforms/sms/plugin.yaml
    module_path: plugins/platforms/sms/__init__.py
  - key: teams
    name: teams-platform
    kind: platform
    version: 1.0.0
    description: Microsoft Teams gateway adapter for Hermes Agent. Connects to Microsoft Teams via the Bot Framework and relays
      messages between Teams chats (personal DMs, group chats, channel posts) and the Hermes agent. Supports Adaptive Card
      approval prompts.
    manifest_path: plugins/platforms/teams/plugin.yaml
    module_path: plugins/platforms/teams/__init__.py
  - key: telegram
    name: telegram-platform
    kind: platform
    version: 1.0.0
    description: Telegram gateway adapter for Hermes Agent. Connects to Telegram via python-telegram-bot and relays messages
      between Telegram chats/groups/topics and the Hermes agent. Supports threads/topics, streaming edits, native media, inline
      keyboards, slash commands, fallback network transport (direct-IP failover), notification modes, mention gating, and
      per-user/chat allowlists.
    manifest_path: plugins/platforms/telegram/plugin.yaml
    module_path: plugins/platforms/telegram/__init__.py
  - key: wecom
    name: wecom-platform
    kind: platform
    version: 1.0.0
    description: 'WeCom / Enterprise WeChat gateway adapter for Hermes Agent. Registers two platforms: ``wecom`` (Smart Robot
      over WebSocket) and ``wecom_callback`` (self-built apps over an HTTP callback endpoint with AES message crypto). Relays
      messages between WeCom chats and the Hermes agent.'
    manifest_path: plugins/platforms/wecom/plugin.yaml
    module_path: plugins/platforms/wecom/__init__.py
  - key: whatsapp
    name: whatsapp-platform
    kind: platform
    version: 1.0.0
    description: WhatsApp gateway adapter for Hermes Agent. Connects to WhatsApp via a local Node.js bridge (WhatsApp Web
      client) over an HTTP API and relays messages between WhatsApp chats and the Hermes agent. Supports DM/group policies,
      mention gating, free-response chats, and per-user allowlists.
    manifest_path: plugins/platforms/whatsapp/plugin.yaml
    module_path: plugins/platforms/whatsapp/__init__.py
